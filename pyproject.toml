[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-space-simulators"
version = "0.1.0"
description = "Shared ensemble collective variables and latent-space simulators for network dynamics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "optuna",
    "torch_geometric",
    "graph_utils @ git+https://github.com/MendelsResearchGroup/graph_utils.git",
    "scipy"
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "nbformat", "nbclient"]
dev = ["pytest", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
